name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r simulador_campo/requirements.txt \
                      -r integrador/requirements.txt \
                      -r painel/requirements.txt \
                      -r tests/requirements.txt

      - name: Rodar testes (pytest)
        run: python -m pytest
